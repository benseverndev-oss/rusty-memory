[workspace]
members = ["crates/rm-core", "crates/rm-survivor"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/benseverndev-oss/rusty-memory"
authors = ["rusty-memory contributors"]

[workspace.dependencies]
rm-core = { path = "crates/rm-core" }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
