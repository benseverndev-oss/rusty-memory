[workspace]
members = [
    "crates/rm-core",
    "crates/rm-survivor",
    "crates/rm-store",
    "crates/rm-resolve",
    "crates/rm-index",
    "crates/rm-engine",
    "crates/rm-graph",
    "crates/rm-extract",
    "crates/rm-providers",
    "crates/rm-embed",
    "crates/rm-host",
    "crates/rm-cli",
    "crates/rm-mcp",
    "crates/rm-conform",
    "crates/rm-contrast",
    "crates/rusty-memory",
]
resolver = "2"
# The ANN bake-off is run by hand, not in CI: it pulls hnsw_rs and takes
# minutes. See benches/ann-bakeoff/README.md.
exclude = ["benches/ann-bakeoff", "benches/locomo", "benches/read-cost"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/benseverndev-oss/rusty-memory"
authors = ["rusty-memory contributors"]

[workspace.dependencies]
rm-core = { path = "crates/rm-core", version = "0.3.0", package = "rusty-memory-core" }
rm-survivor = { path = "crates/rm-survivor", version = "0.3.0", package = "rusty-memory-survivor" }
rm-store = { path = "crates/rm-store", version = "0.3.0", package = "rusty-memory-store" }
rm-resolve = { path = "crates/rm-resolve", version = "0.3.0", package = "rusty-memory-resolve" }
rm-index = { path = "crates/rm-index", version = "0.3.0", package = "rusty-memory-index" }
rm-engine = { path = "crates/rm-engine", version = "0.3.0", package = "rusty-memory-engine" }
rm-graph = { path = "crates/rm-graph", version = "0.3.0", package = "rusty-memory-graph" }
rm-extract = { path = "crates/rm-extract", version = "0.3.0", package = "rusty-memory-extract" }
rm-providers = { path = "crates/rm-providers", version = "0.3.0", package = "rusty-memory-providers" }
rm-embed = { path = "crates/rm-embed", version = "0.3.0", package = "rusty-memory-embed" }
rm-host = { path = "crates/rm-host", version = "0.3.0", package = "rusty-memory-host" }
rm-cli = { path = "crates/rm-cli", version = "0.3.0", package = "rusty-memory-cli" }
rm-mcp = { path = "crates/rm-mcp", version = "0.3.0", package = "rusty-memory-mcp" }
rm-conform = { path = "crates/rm-conform", version = "0.3.0", package = "rusty-memory-conform" }
rm-contrast = { path = "crates/rm-contrast", version = "0.3.0", package = "rusty-memory-contrast" }
rusty-memory = { path = "crates/rusty-memory", version = "0.3.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", default-features = false, features = ["tls"] }
# Pinned to the versions `ureq` itself resolves, so the `ClientConfig` handed to
# `AgentBuilder::tls_config` is the same type `ureq` expects rather than a
# same-named type from a second copy of the crate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
