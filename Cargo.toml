[workspace]
members = [
    "crates/rm-core",
    "crates/rm-survivor",
    "crates/rm-store",
    "crates/rm-resolve",
    "crates/rm-index",
    "crates/rm-engine",
    "crates/rm-graph",
    "crates/rm-extract",
    "crates/rm-providers",
    "crates/rm-host",
    "crates/rm-cli",
    "crates/rm-mcp",
]
resolver = "2"
# The ANN bake-off is run by hand, not in CI: it pulls hnsw_rs and takes
# minutes. See benches/ann-bakeoff/README.md.
exclude = ["benches/ann-bakeoff"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/benseverndev-oss/rusty-memory"
authors = ["rusty-memory contributors"]

[workspace.dependencies]
rm-core = { path = "crates/rm-core" }
rm-survivor = { path = "crates/rm-survivor" }
rm-store = { path = "crates/rm-store" }
rm-resolve = { path = "crates/rm-resolve" }
rm-index = { path = "crates/rm-index" }
rm-engine = { path = "crates/rm-engine" }
rm-graph = { path = "crates/rm-graph" }
rm-extract = { path = "crates/rm-extract" }
rm-providers = { path = "crates/rm-providers" }
rm-host = { path = "crates/rm-host" }
rm-cli = { path = "crates/rm-cli" }
rm-mcp = { path = "crates/rm-mcp" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", default-features = false, features = ["tls"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
