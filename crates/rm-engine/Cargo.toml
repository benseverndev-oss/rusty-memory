[package]
name = "rusty-memory-engine"
version.workspace = true
description = "remember() / recall() / forget() over the rusty-memory crates"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The package is namespaced for crates.io; the lib keeps the short name so
# every `use rm_engine::...` -- including this crate's own tests -- is unchanged.
[lib]
name = "rm_engine"

[dependencies]
rm-core = { workspace = true }
rm-survivor = { workspace = true }
rm-store = { workspace = true }
rm-resolve = { workspace = true }
rm-index = { workspace = true }
rm-graph = { workspace = true }
rm-extract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
