[package]
name = "rusty-memory-mcp"
version.workspace = true
description = "rmem-mcp: an MCP server over rusty-memory"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rmem-mcp"
path = "src/main.rs"

# The package is namespaced for crates.io; the lib keeps the short name so
# every `use rm_mcp::...` -- including this crate's own tests -- is unchanged.
[lib]
name = "rm_mcp"

[dependencies]
rm-engine = { workspace = true }
rm-host = { workspace = true }
rm-embed = { workspace = true }
serde_json = { workspace = true }
