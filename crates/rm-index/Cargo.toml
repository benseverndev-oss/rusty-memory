[package]
name = "rusty-memory-index"
version.workspace = true
description = "Vector index for agent memory: exact search with deletion, filtering and persistence"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The package is namespaced for crates.io; the lib keeps the short name so
# every `use rm_index::...` -- including this crate's own tests -- is unchanged.
[lib]
name = "rm_index"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
