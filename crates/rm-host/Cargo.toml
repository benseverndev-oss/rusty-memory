[package]
name = "rusty-memory-host"
version.workspace = true
description = "What a host of rusty-memory has to decide: config, store file, and the operations over them"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The package is namespaced for crates.io; the lib keeps the short name so
# every `use rm_host::...` -- including this crate's own tests -- is unchanged.
[lib]
name = "rm_host"

[dependencies]
rm-core = { workspace = true }
rm-engine = { workspace = true }
rm-extract = { workspace = true }
rm-providers = { workspace = true }
rm-embed = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# The resolution corpus is JSON on disk, so its ground truth is data a
# reviewer can read rather than a fixture built by the code under test.
serde_json = { workspace = true }
