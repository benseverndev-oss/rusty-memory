[package]
name = "rm-cli"
version = "0.0.0"
description = "rmem: a command line over rusty-memory"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rmem"
path = "src/main.rs"

[dependencies]
rm-engine = { workspace = true }
rm-extract = { workspace = true }
rm-providers = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Only for `Decision`, to read a ruleset's thresholds back through
# `decide()`'s boundaries in a test. Already in the tree via rm-engine, which
# re-exports every other type this crate needs from rm-resolve.
rm-resolve = { workspace = true }
