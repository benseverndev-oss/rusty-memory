[package]
name = "rusty-memory-extract"
version.workspace = true
description = "Turn a line of dialogue into mentions, facts and relations"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The package is namespaced for crates.io; the lib keeps the short name so
# every `use rm_extract::...` -- including this crate's own tests -- is unchanged.
[lib]
name = "rm_extract"

[dependencies]
rm-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
