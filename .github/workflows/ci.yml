name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. This job builds and tests and writes nothing back, so
# the token it is handed should not be able to.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes, and the default leaves a usable token in the
          # runner's git config for every later step to inherit.
          persist-credentials: false
      # No toolchain action: rust-toolchain.toml names the version, and an
      # action that installs one would only be a second place to change it.
      # `rustup show` is what makes the install happen here, with the version
      # in the log, rather than implicitly inside whichever cargo step ran
      # first. It has to precede the cache, which keys on `rustc -vV`.
      - name: Toolchain
        run: |
          rustup show
          # The pin is only worth something if it actually bound, and a green
          # CI does not show that on its own: the runner ships its own stable,
          # and while that happens to equal the pin both paths give the same
          # answer. The day they part company is exactly the day this matters,
          # so compare them rather than trusting the coincidence.
          want=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          got=$(rustc --version | cut -d' ' -f2)
          if [ "$got" != "$want" ]; then
            echo "::error::rust-toolchain.toml pins $want but rustc here is $got -- the pin did not bind"
            exit 1
          fi
          echo "rustc $got, as pinned"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
